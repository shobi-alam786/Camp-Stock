
name: Build Camp Stock Signed Release APK

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix Gradle Wrapper Permission
        working-directory: android-camp-stock
        run: chmod +x gradlew

      - name: Prepare Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/camp-stock-release.jks"

          test -s "$RUNNER_TEMP/camp-stock-release.jks"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/camp-stock-release.jks" \
            >> "$GITHUB_ENV"

      - name: Run Unit Tests
        working-directory: android-camp-stock
        run: ./gradlew testDebugUnitTest

      - name: Build Signed Release APK
        working-directory: android-camp-stock
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify Release APK
        run: |
          APK_PATH="android-camp-stock/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK was not found at $APK_PATH"
            echo "Available APK files:"
            find android-camp-stock -type f -name "*.apk" || true
            exit 1
          fi

          echo "Release APK created successfully."
          ls -lh "$APK_PATH"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CampStock-Signed-Release-APK
          path: android-camp-stock/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
