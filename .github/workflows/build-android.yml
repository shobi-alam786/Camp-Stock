name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'android-camp-stock/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-camp-stock/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: android-camp-stock
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: android-camp-stock
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android-camp-stock
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: camp-stock-android-debug
          path: android-camp-stock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Camp Stock ${{ github.ref_name }}
          generate_release_notes: true
          files: android-camp-stock/app/build/outputs/apk/debug/app-debug.apk
